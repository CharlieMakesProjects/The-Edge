name: Update Hidden Gems
on:
  schedule:
    - cron: '30 13 * * 1'  # Monday ~9:30am ET (market open) — UTC offset assumes EDT, same DST caveat as update_data.yml
    - cron: '30 13 * * 5'  # Friday ~9:30am ET (market open)
  workflow_dispatch: {}       # manual trigger button

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python scripts/update_gems.py
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      - name: Commit updated gems data
        run: |
          git config user.name "The Edge Bot"
          git config user.email "bot@theedge.com"
          git add data/market_data.json
          git diff --staged --quiet || git commit -m "Update hidden gems $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase
          git push
